<!doctype html>
<html><head><meta charset="utf-8"><title>Page Flyover</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#f6f8f8;overflow:hidden}
  canvas{position:absolute;left:0;top:0}
</style></head>
<body>
<canvas id="gl"></canvas>
<script>
const QS = new URLSearchParams(location.search);
const CONFIG = Object.assign({
  brand: 'Your Brand',
  monogram: null,
  logoSrc: null,
  line1: 'Your website, in 3D.',
  tail: 'See it live.',
  maxCruise: 1000,
  maxDur: 20,
}, JSON.parse(QS.get('cfg') || '{}'));
const SCENE_DIR = QS.get('scene') || 'capture';

const FORMATS = { '5:4': [1440, 1152], '16:9': [1920, 1080], '9:16': [1080, 1920], '1:1': [1080, 1080], '4:5': [1080, 1350] };

const ASPECT = { '5:4': [5, 4], '16:9': [16, 9], '9:16': [9, 16], '1:1': [1, 1], '4:5': [4, 5] };
const r4 = v => Math.round(v / 4) * 4;
const [W, H] = (() => { const f = ASPECT[CONFIG.format] ? CONFIG.format : '5:4', q = +CONFIG.quality;
  if (!q) return FORMATS[f]; const [a, b] = ASPECT[f];
  return a >= b ? [r4(q * a / b), r4(q)] : [r4(q), r4(q * b / a)]; })();
const DEG = Math.PI / 180;
const SX = W / 1440, SY = H / 1152;
const F = 1880 * SX * (W / H < 0.95 ? 1.3 : 1);

const STYLES = { calm: { tilt: 48, d0: 1500, d1: 1880, dofF: 48, lift: 0.7 }, default: { tilt: 56, d0: 1360, d1: 1700, dofF: 75, lift: 1 },
  energetic: { tilt: 61, d0: 1220, d1: 1580, dofF: 95, lift: 1.3 } };
const STYLE = STYLES[CONFIG.style] || STYLES.default;

const TILT = Math.min(STYLE.tilt, 80 - Math.atan(H / 2 / F) / DEG) * DEG;
const DOF_F = STYLE.dofF * SX, DOF_B = 6 * SX, DOF_CAP = 120 * SX;
document.getElementById('gl').width = W; document.getElementById('gl').height = H;
Object.assign(document.getElementById('gl').style, { width: W + 'px', height: H + 'px' });
let HAZE = [0xf6 / 255, 0xf8 / 255, 0xf8 / 255], FLOOR_A = [0.976, 0.984, 0.984], FLOOR_B = [0.949, 0.953, 0.965], INK = { dark: false };
const VH = 900;
const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;
const eio2 = u => (u = cl(u), u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u));

let D, PH;

let K = 1, EXT = 0, DUR = 14.5, SIG = 1;
const canonK = t => t < 1.6 ? t : t < 1.6 + 5.7 * K ? 1.6 + (t - 1.6) / K : t - EXT;
const canon = t => canonK(t / SIG);

function share(t) {
  if (t < 0.6) return 0.5 * sm(0, 0.6, t);
  if (t < 1.25) return 0.5;
  if (t < 1.6) return 0.5 + 0.5 * sm(1.25, 1.6, t);
  if (t < 7.3) return 1.0;
  return 1 - 0.88 * sm(7.3, 8.3, t);
}
const DT = 0.0005, TMAX = 15;
const Stab = new Float64Array(Math.ceil(TMAX / DT) + 2);
(() => { let s = 0, prev = share(0); Stab[0] = 0;
  for (let i = 1; i < Stab.length; i++) { const v = share(i * DT); s += (prev + v) * 0.5 * DT; prev = v; Stab[i] = s; } })();
const S = t => { const f = cl(t, 0, TMAX) / DT, i = Math.floor(f); return mix(Stab[i], Stab[i + 1], f - i); };

function riseV(t) {
  if (t < 7.75) return 0;
  if (t < 8.35) return sm(7.75, 8.35, t);
  if (t < 8.95) return 1;
  return 1 - sm(8.95, 9.25, t);
}
const Ptab = new Float64Array(Stab.length);
(() => { let s = 0, prev = 0; for (let i = 1; i < Ptab.length; i++) { const v = riseV(i * DT); s += (prev + v) * .5 * DT; prev = v; Ptab[i] = s; }
  const tot = Ptab[Math.round(9.3 / DT)]; for (let i = 0; i < Ptab.length; i++) Ptab[i] = Math.min(1, Ptab[i] / tot); })();
const P = t => { const f = cl(t, 0, TMAX) / DT, i = Math.floor(f); return mix(Ptab[i], Ptab[i + 1], f - i); };

const dFlight = t => STYLE.d0 + (STYLE.d1 - STYLE.d0) * (1 - Math.pow(1 - cl(t / 8.2), 3));
const BOT = H - 42 * SY - H / 2;
let dEnd, dCard, cruise, ly0, dOv, Y0dive;
function lyHold(d, th) { const c = Math.cos(th), s = Math.sin(th); return PH - BOT * d / (F * c + BOT * s); }
function rawRise(t) {
  const lf = Math.log(dFlight(Math.min(t, 8.2)));
  const d = Math.exp(lf + P(t) * (Math.log(dEnd) - lf));
  const th = TILT * (1 - sm(8.15, 8.95, t));
  return { d, th };
}
const lyGlide = t => ly0 + cruise * S(t);

function camera(t) {
  let d, th, ly;
  if (t <= 9.25) {
    ({ d, th } = rawRise(t));
    ly = mix(lyGlide(t), lyHold(d, th), sm(8.3, 8.65, t));
  } else if (t <= 9.47) {
    th = 0; d = dEnd * (1 - 0.035 * ((t - 9.25) / 0.22));
    ly = PH / 2;
  } else if (t <= 9.97) {
    th = 0; const u = (t - 9.47) / 0.5;
    d = Math.exp(mix(Math.log(dOv), Math.log(dCard), eio2(u)));
    const ytop = mix(Y0dive, LAY.cardTop, sm(0.45, 1, u));
    ly = (H / 2 - ytop) * d / F;
  } else {
    th = 0; d = dCard * (1 - 0.02 * sm(9.97, 14.5, t));
    ly = VH / 2 - (LAY.cardTop + LAY.cardH / 2 - H / 2) * d / F;
  }
  return { lx: 720, ly, d, th };
}
function basis(cam) {
  const s = Math.sin(cam.th), c = Math.cos(cam.th);
  const C = [cam.lx, cam.ly + cam.d * s, cam.d * c];
  return { C, R: [1, 0, 0], U: [0, -c, s], Fw: [0, -s, -c], d: cam.d };
}
function project(B, p) {
  const v = [p[0] - B.C[0], p[1] - B.C[1], p[2] - B.C[2]];
  const xc = v[0], yc = v[1] * B.U[1] + v[2] * B.U[2], zc = v[1] * B.Fw[1] + v[2] * B.Fw[2];
  return { X: W / 2 + F * xc / zc, Y: H / 2 - F * yc / zc, z: zc };
}
function unproject(B, X, Y, depth) {
  const xc = (X - W / 2) * depth / F, yc = -(Y - H / 2) * depth / F;
  return [B.C[0] + xc + B.Fw[0] * depth, B.C[1] + yc * B.U[1] + depth * B.Fw[1], B.C[2] + yc * B.U[2] + depth * B.Fw[2]];
}

const KIND_DEF = { card: { z0: 10, z1: 34, a1: 20 }, photo: { z0: 12, z1: 40, a1: 26 }, chip: { z0: 6, z1: 30, a1: 24 },
  cta: { z0: 6, z1: 30, a1: 24 }, testimonial: { z0: 22, z1: 112, a1: 30, lyWin: [1007, 325] } };
function assignFx(D) {
  const byArea = arr => arr.sort((a, b) => b.w * b.h - a.w * a.h);
  const hero = D.pieces.filter(p => p.zone === 'hero' && !p.fx), intro = D.pieces.filter(p => p.zone === 'intro' && !p.fx);
  byArea(hero.filter(p => p.role === 'photo')).forEach((p, i) => p.cfg = i === 0 ? { z0: 8, z1: 30, a1: 0, win: [0.1, 1.35] } : { z0: 8, z1: 72, a1: 30, win: [0.15, 1.35] });
  for (const p of hero) if (!p.cfg) p.cfg = p.role === 'cta' ? { z0: 6, z1: 64, a1: 30, win: [0.1, 1.3] } : { z0: 8, z1: 60, a1: 28, win: [0.12, 1.35] };
  byArea(intro.filter(p => p.role === 'photo')).slice(0, 3).forEach((p, i) => p.cfg = i === 0 ? { z0: 10, z1: 112, a1: 46, win: [1.35, 2.7] } : { z0: 10, z1: 124, a1: 46, win: [1.45, 2.7] });
  for (const p of D.pieces) { if (p.fx) p.cfg = { ...p.fx }; if (!p.cfg) p.cfg = { ...(KIND_DEF[p.role] || KIND_DEF.card) }; }
}

function rankPieces(list) {
  for (const p of list) { if (p.off) p.cfg = { z0: 0.5, z1: 0.5, a1: 0 }; }
  list.sort((a, b) => (a.cfg.z1 - b.cfg.z1) || ((a.y + a.h) - (b.y + b.h)) || (a.x - b.x));
  list.forEach((p, i) => { p.rank = i; p.below = []; });
  const M = 70;
  for (const a of list) for (const b of list) if (b.rank < a.rank &&
    a.x - M < b.x + b.w && b.x - M < a.x + a.w && a.y - M < b.y + b.h && b.y - M < a.y + a.h) a.below.push(b);
}
function pieceState(pc, t, cam) {
  if (window.QA_FLAT) return { z: 0.5, a: 0, dx: 0, fade: 0, alpha: 1 };
  const cfg = pc.cfg;
  const cy = pc.y + pc.h / 2;
  let k;
  if (cfg.win) k = sm(cfg.win[0], cfg.win[1], t);
  else if (cfg.lyWin) k = sm(cy - cfg.lyWin[0], cy - cfg.lyWin[1], lyGlide(Math.min(t, 8.3)));
  else k = sm(cy - 720, cy + 260, lyGlide(Math.min(t, 8.3)));
  let z = mix(cfg.z0, cfg.z0 + (cfg.z1 - cfg.z0) * STYLE.lift, k), a = Math.min(62, cfg.a1 * STYLE.lift) * DEG * k, dx = (cfg.dx || 0) * sm(cfg.win ? cfg.win[0] : 0, cfg.win ? cfg.win[1] + 0.3 : 1, t);
  const hero = cy < D.hero.h;
  const st = 1 - sm(7.75, 9.1, t); z = mix(hero ? 4 : cfg.z0, z, st); a *= st; dx *= st;

  let fade = 0, alpha = 1;
  if (!hero) { const u = (t - 9.47) / 0.5; fade = sm(0, 0.55, u); alpha = 1 - sm(0.5, 0.7, u); }
  return { z, a, dx, fade, alpha };
}

const TILE_START = i => [225 + i * 40, 698, 1];
const TILE_HANG = [[-150, 30, 260, 172], [1600, 10, 300, 192], [-70, 250, 190, 142], [1515, 270, 225, 156]];
let T2world;
function tiles(t, B) {
  const out = []; if (window.QA_FLAT) return out;
  for (let i = 0; i < 4; i++) {
    const k = eio2(sm(0.1 + i * 0.06, 1.35, t));
    const s0 = TILE_START(i), h = TILE_HANG[i];
    let p = [mix(s0[0], h[0], k), mix(s0[1], h[1], k), mix(s0[2], h[2], k) + 60 * Math.sin(Math.PI * k)];
    let size = mix(32, h[3], k), bb = k, vis = 1;
    p[1] += 300 * sm(1.2, 2.4, t);
    if (i === 0 || i === 1) {
      const e = sm(8.0, 9.9, t);
      const tgt = i === 0 ? [-6, 14, 170, 150] : [1446, 6, 120, 140];
      p = [mix(p[0], tgt[0], e), mix(p[1], tgt[1], e), mix(p[2], tgt[2], e)]; size = mix(size, tgt[3], e);
      if (t > 9.97) { const q = t - 9.97; p[0] += 4 * Math.sin(q * 0.9 + i); p[1] += 3 * Math.sin(q * 0.7 + 2 * i); }
    }
    if (i === 2 && t > 3.0) {
      if (t < 7.0) { p = [T2world[0] + (t - 5.4) * 60, T2world[1] - (t - 5.4) * 90, T2world[2]]; size = 150; bb = 1; }
      else { p = [1690, 560, 8]; size = 150; bb = 1;
        if (t > 9.97) { const q = t - 9.97; p[1] += 4 * Math.sin(q * 0.8); } }
    }
    if (i === 3 && t > 3.0) vis = 0;
    out.push({ p, size, bb, vis, shadow: i !== 3 || t < 3 });
  }

  if (t > 9.55) {
    const e = 1 - Math.pow(1 - sm(9.55, 10.6, t), 3), q = t - 9.55;
    for (const [sx0, sy0, sx1, sy1, dep, sz] of [[-260, 1500, 120, 1080, 640, 190], [1760, 1520, 1330, 1060, 700, 200]]) {
      const X = (mix(sx0, sx1, e) + 6 * Math.sin(q * .6)) * SX, Y = (mix(sy0, sy1, e) + 5 * Math.sin(q * .5 + 1)) * SY;
      out.push({ p: unproject(B, X, Y, dep), size: sz, bb: 1, vis: 1, shadow: false });
    }
  }
  return out;
}

const gl = document.getElementById('gl').getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true, premultipliedAlpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_float_blend');
const ANISO = gl.getExtension('EXT_texture_filter_anisotropic');

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + src); return s; }
function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u }; }

const VS_WORLD = `#version 300 es
in vec2 aC;
uniform vec3 uC,uU,uFw; uniform float uF; uniform vec2 uRes;
uniform vec3 uO,uAx,uAy;
out vec2 vUV; out float vZ;
void main(){ vec3 P=uO+aC.x*uAx+aC.y*uAy; vec3 v=P-uC;
  float xc=v.x, yc=dot(v,uU), zc=dot(v,uFw);
  vUV=aC; vZ=zc; float n=4.0,f=400000.0;
  gl_Position=vec4(uF*xc/(uRes.x*.5), uF*yc/(uRes.y*.5), zc*(f+n)/(f-n)-2.0*f*n/(f-n), zc); }`;
const VS_FULL = `#version 300 es
in vec2 aC; out vec2 vUV; void main(){ vUV=aC; gl_Position=vec4(aC*2.-1.,0,1); }`;

const FS_FLOOR = `#version 300 es
precision highp float;
uniform vec3 uC,uU,uFw; uniform float uF; uniform vec2 uRes;
uniform vec4 uMask; uniform float uRad, uShadowA; uniform vec3 uFloorA, uFloorB, uShadeC;
in vec2 vUV; layout(location=0) out vec4 o; layout(location=1) out vec4 oD;
float rr(vec2 p, vec4 m, float r){ vec2 c=(m.xy+m.zw)*.5, h=(m.zw-m.xy)*.5; vec2 q=abs(p-c)-h+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
void main(){
  vec2 s=vec2(vUV.x*uRes.x, (1.-vUV.y)*uRes.y);
  vec3 dir=vec3((s.x-uRes.x*.5)/uF,0,0) + uU*(-(s.y-uRes.y*.5)/uF) + uFw;
  float t=-uC.z/dir.z; vec3 P=uC+t*dir;
  vec2 n=(s-uRes*.5)/(uRes*.5); float r=clamp(length(n)/1.4142,0.,1.);
  vec3 col=mix(uFloorA, uFloorB, smoothstep(.15,1.,r));
  float px=t/uF;
  float sd=rr(P.xy-vec2(0,18.*max(px,1.)), uMask, uRad);
  float wide=exp(-max(sd,0.)/(70.*max(px,1.)))*0.10 + exp(-max(sd,0.)/(10.*max(px,1.)))*0.07;
  col=mix(col, uShadeC, wide*uShadowA);
  o=vec4(col,1); oD=vec4(t,0,0,1); }`;

const FS_PAGE = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec4 uMask; uniform float uRad, uFade, uFadeY; uniform vec3 uHaze; uniform vec2 uOrg, uSize;
in vec2 vUV; in float vZ; layout(location=0) out vec4 o; layout(location=1) out vec4 oD;
float rr(vec2 p, vec4 m, float r){ vec2 c=(m.xy+m.zw)*.5, h=(m.zw-m.xy)*.5; vec2 q=abs(p-c)-h+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
void main(){ vec2 p=uOrg+vUV*uSize; vec4 c=texture(uTex,vUV);
  float sd=rr(p,uMask,uRad); float aa=max(fwidth(sd),.5); float a=1.-smoothstep(-aa,aa,sd);
  float fb=uFade*smoothstep(uFadeY-30.,uFadeY+30.,p.y);
  c.rgb=mix(c.rgb,uHaze*c.a,fb); c*=a;
  o=c; oD=vec4(vZ*c.a,0,0,c.a); }`;

const FS_PIECE = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform float uFade, uAlpha; uniform vec3 uHaze;
in vec2 vUV; in float vZ; layout(location=0) out vec4 o; layout(location=1) out vec4 oD;
void main(){ vec4 c=texture(uTex,vUV); c.rgb=mix(c.rgb,uHaze*c.a,uFade); c*=uAlpha; o=c; oD=vec4(vZ*c.a,0,0,c.a); }`;

const FS_SHADOW = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uMarg; uniform vec2 uBlurUV; uniform float uLod, uOp;
in vec2 vUV; in float vZ; layout(location=0) out vec4 o; layout(location=1) out vec4 oD;
void main(){ vec2 uv=vUV*(1.+2.*uMarg)-uMarg; float a=0.;
  for(int i=0;i<32;i++){ float r=sqrt((float(i)+.5)/32.), an=float(i)*2.39996;
    vec2 q=uv+uBlurUV*r*vec2(cos(an),sin(an));
    float inside=step(0.,q.x)*step(q.x,1.)*step(0.,q.y)*step(q.y,1.);
    a+=textureLod(uTex,q,uLod).a*inside; }
  a=a/32.*uOp; o=vec4(vec3(0.102,0.129,0.2)*a,a); oD=vec4(vZ*a,0,0,a); }`;

const FS_SPRITE = `#version 300 es
precision highp float;
uniform sampler2D uTexA, uTexB; uniform float uMixK, uFocus, uSpan;
in vec2 vUV; in float vZ; layout(location=0) out vec4 o; layout(location=1) out vec4 oD;
void main(){ vec2 uv=(vUV-.5)*uSpan+.5;
  vec4 c=mix(texture(uTexA,uv),texture(uTexB,uv),uMixK);
  o=c; oD=vec4(uFocus*c.a,0,0,c.a); }`;
const FS_SSHADOW = `#version 300 es
precision highp float;
uniform sampler2D uTexA, uTexB; uniform float uMixK, uOp;
in vec2 vUV; in float vZ; layout(location=0) out vec4 o; layout(location=1) out vec4 oD;
void main(){ float a=mix(texture(uTexA,vUV).a,texture(uTexB,vUV).a,uMixK)*uOp; o=vec4(vec3(0.102,0.129,0.2)*a,a); oD=vec4(vZ*a,0,0,a); }`;
const FS_TILEMAX = `#version 300 es
precision highp float;
uniform sampler2D uDepth; uniform float uFocus, uDofF, uCap; uniform vec2 uRes;
out vec4 o;
float coc(float z){ return z<uFocus ? min(uCap, uDofF*(uFocus-z)/z) : 0.; }
void main(){ ivec2 b=ivec2(gl_FragCoord.xy)*16; float m=0.;
  for(int y=0;y<16;y+=2) for(int x=0;x<16;x+=2){ ivec2 q=min(b+ivec2(x,y), ivec2(uRes)-1); m=max(m,coc(texelFetch(uDepth,q,0).r)); }
  o=vec4(m,0,0,1); }`;

const FS_DILATE = `#version 300 es
precision highp float; uniform sampler2D uTile; out vec4 o;
void main(){ ivec2 c=ivec2(gl_FragCoord.xy), ts=textureSize(uTile,0); float m=0.;
  for(int j=-8;j<=8;j++) for(int i=-8;i<=8;i++){ ivec2 q=c+ivec2(i,j); if(q.x<0||q.y<0||q.x>=ts.x||q.y>=ts.y) continue;
    float v=texelFetch(uTile,q,0).r; float dist=max(0.,length(vec2(i,j))-1.5)*16.; if(v>dist) m=max(m,v); }
  o=vec4(m,0,0,1); }`;
const FS_DOF = `#version 300 es
precision highp float;
uniform sampler2D uCol, uDepth, uTile; uniform float uFocus, uW, uDbg, uRot, uDofF, uDofB, uCap; uniform int uTaps; uniform vec2 uRes;
in vec2 vUV; out vec4 o;
float scoc(float z){ return z<uFocus ? min(uCap, uDofF*(uFocus-z)/z) : min(uCap, uDofB*(z-uFocus)/z); }
void main(){
  ivec2 pc=ivec2(gl_FragCoord.xy); float zc=texelFetch(uDepth,pc,0).r; float cc=scoc(zc);
  float nm=texelFetch(uTile,pc/16,0).r;
  float R=max(cc,nm); if(uDbg>0.5) R=0.;
  vec4 cen=texelFetch(uCol,pc,0);
  if(R<0.6){ o=vec4(cen.rgb*uW,uW); return; }
  float lod=clamp(log2(R/3.2),0.,7.);
  vec3 acc=cen.rgb; float wsum=1.;
  float nt=float(uTaps);
  for(int i=0;i<40;i++){ if(i>=uTaps) break;
    float r=R*sqrt((float(i)+.5)/nt), an=float(i)*2.39996323+uRot;
    vec2 off=r*vec2(cos(an),sin(an));
    vec2 q=gl_FragCoord.xy+off;
    if(q.x<0.||q.y<0.||q.x>=uRes.x||q.y>=uRes.y) continue;
    float zt=texelFetch(uDepth,ivec2(q),0).r; float ct=scoc(zt);
    float cov = zt<=zc ? ct : min(ct,cc);

let lastSub = 0;

window.renderFrames = async function (i0, i1, fps, wsUrl, maxSub = 16) {

  const ws = new WebSocket(wsUrl); ws.binaryType = 'arraybuffer'; await new Promise((r, j) => { ws.onopen = r; ws.onerror = j; });

window.realTime = tc => SIG * (tc < 1.6 ? tc : tc < 7.3 ? 1.6 + (tc - 1.6) * K : tc + EXT);

window.audioCues = function (rate = 100) {
  const n = Math.ceil(DUR * rate), env = new Float32Array(n), dt = 1 / rate;

  for (let i = 0; i < n; i++) { const t = i * dt;
    const a = camera(Math.max(0, canon(t))), b = camera(Math.max(0, canon(t + dt)));
    const glide = Math.abs(b.ly - a.ly) * F * Math.cos(a.th) / a.d / W, zoom = Math.abs(Math.log(b.d / a.d)) * 0.5;
    env[i] = (glide + zoom) * rate; }
  const ev = [];
  const firstCross = (f, lo, hi) => { for (let t = lo; t <= hi; t += 0.01) if (f(t)) return t; return null; };

  for (const pc of pieces) {
    const c = pc.cfg, lift = (c.z1 - c.z0) * STYLE.lift; if (pc.off || lift < 14) continue;
    const cy = pc.y + pc.h / 2;
    const tc = c.win ? c.win[0] + 0.3 * (c.win[1] - c.win[0])
      : firstCross(t => (c.lyWin ? sm(cy - c.lyWin[0], cy - c.lyWin[1], lyGlide(t)) : sm(cy - 720, cy + 260, lyGlide(t))) > 0.3, 0, 8.3);

  }

window.cameraAt = t => { const c = camera(canon(t)); return { ...c, th: c.th / DEG }; };
window.debug = () => ({ cruise, ly0, dEnd, dCard, PH, K, DUR, SIG, EXT, W, H, renderer: gl.getParameter(gl.RENDERER), aniso: !!ANISO, lastSub });

window.ready = (async () => {
  D = await fetch(`${SCENE_DIR}/scene.json`).then(r => r.json()); PH = D.H;
  D.footerTitleY = Math.min(PH - 40, D.footer.y + 140);

  if (D.dark) { FLOOR_A = bg.map(v => Math.min(1, v + 0.045)); FLOOR_B = bg.map(v => Math.min(1, v + 0.015)); HAZE = bg.map(v => Math.min(1, v + 0.035)); }
  else { FLOOR_A = bg.map((v, i) => v * [0.976, 0.984, 0.984][i]); FLOOR_B = bg.map((v, i) => v * [0.949, 0.953, 0.965][i]); HAZE = bg.map((v, i) => v * [0xf6, 0xf8, 0xf8][i] / 255); }

  await document.fonts.load('500 74px Geist', allText); await document.fonts.load('italic 82px "Instrument Serif"', allText); await document.fonts.load('500 21px Geist', allText); await document.fonts.ready;

  await Promise.all(D.pieces.map(async pc => { const img = await loadImg(`${SCENE_DIR}/${pc.file}`); pc.tex = imgTex(img); pc.texW = img.width; }));
